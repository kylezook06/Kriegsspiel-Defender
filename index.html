<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kriegsspiel Defender</title>
    <!-- p5.js 1.11.x build pinned via CDN for reproducibility -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #111;
        font-family: "JetBrains Mono", "Fira Code", monospace;
      }

      canvas {
        display: block;
        margin: 0 auto;
        border: 2px solid #0c1833;
        box-shadow: 0 0 24px rgba(0, 0, 0, 0.35);
      }

      .instructions {
        color: #e6e2d3;
        text-align: center;
        padding: 1rem 0 1.5rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="instructions">
      <h1>Kriegsspiel Defender – Level 1</h1>
      <p>
        Move with <strong>WASD</strong> or the arrow keys. Fire with
        <strong>space</strong>. Restart with <strong>R</strong> after victory or defeat.
      </p>
      <p>
        Assets are placeholders—drop your own PNGs into <code>assets/</code> and uncomment
        the <code>preload()</code> block in <code>sketch.js</code> to bring the map and minis to life.
      </p>
    </div>
    <script src="sketch.js"></script>
  </body>
</html>
